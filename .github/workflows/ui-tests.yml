name: Brottskatalog UI smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "brb14-expansion-15.js"
      - "brb10-review-15.js"
      - "scripts/brb10_15_test.mjs"
      - "rekvisit-typexempel-15.js"
      - "scripts/rekvisit_typfall_15_test.mjs"
      - "scripts/brb14_15_test.mjs"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "README.md"
      - "penalty-normalize-12.js"
      - "core-penalties-13.js"
      - "scripts/core_penalties_13_test.mjs"
      - "coercive-07.js"
      - "field-07.js"
      - "scripts/ui_smoke.mjs"
      - "scripts/stage_rules_test.mjs"
      - "stages-08.js"
      - "special-09.js"
      - "brb20-13.js"
      - "brb4-review-14.js"
      - "brb17-review-14.js"
      - "special-penalties-review-14.js"
      - "scripts/special_penalties_14_test.mjs"
      - "scripts/brb17_14_test.mjs"
      - "scripts/brb4_14_test.mjs"
      - "scripts/brb20_13_test.mjs"
      - "special-law-import-12.js"
      - "data/special-provisions-generated.js"
      - "coercive-09.js"
      - "decisions-10.js"
      - "prosecution-10.js"
      - "prosecution-final-12.js"
      - "quality-11.js"
      - "scripts/quality_11_test.mjs"
      - "scripts/integration_09.mjs"
      - "scripts/audit_catalog.mjs"
      - "sources-qa.js"
      - ".github/workflows/ui-tests.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "brb14-expansion-15.js"
      - "brb10-review-15.js"
      - "scripts/brb10_15_test.mjs"
      - "rekvisit-typexempel-15.js"
      - "scripts/rekvisit_typfall_15_test.mjs"
      - "scripts/brb14_15_test.mjs"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "README.md"
      - "penalty-normalize-12.js"
      - "core-penalties-13.js"
      - "scripts/core_penalties_13_test.mjs"
      - "coercive-07.js"
      - "field-07.js"
      - "catalog-03.js"
      - "glossary-03.js"
      - "data/provisions-generated.js"
      - "scripts/ui_smoke.mjs"
      - "scripts/stage_rules_test.mjs"
      - "stages-08.js"
      - "special-09.js"
      - "brb20-13.js"
      - "brb4-review-14.js"
      - "brb17-review-14.js"
      - "special-penalties-review-14.js"
      - "scripts/special_penalties_14_test.mjs"
      - "scripts/brb17_14_test.mjs"
      - "scripts/brb4_14_test.mjs"
      - "scripts/brb20_13_test.mjs"
      - "special-law-import-12.js"
      - "data/special-provisions-generated.js"
      - "coercive-09.js"
      - "decisions-10.js"
      - "prosecution-10.js"
      - "prosecution-final-12.js"
      - "quality-11.js"
      - "scripts/quality_11_test.mjs"
      - "scripts/integration_09.mjs"
      - "scripts/audit_catalog.mjs"
      - "sources-qa.js"
      - ".github/workflows/ui-tests.yml"
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sixteen BrB penalty ranges and conflict protection
        run: node scripts/core_penalties_13_test.mjs
      - name: Verify offence stages
        run: node scripts/stage_rules_test.mjs
      - name: Verify new 2026 public-office offences
        run: node scripts/brb20_13_test.mjs
      - name: Verify core BrB chapter 4 penalty source checks
        run: node scripts/brb4_14_test.mjs
      - name: Verify BrB 17 police-related penalty scales
        run: node scripts/brb17_14_test.mjs
      - name: Verify specialty criminal penalty scales
        run: node scripts/special_penalties_14_test.mjs
      - name: V1.5 draft source-scoped BrB14 expansions
        run: node scripts/brb14_15_test.mjs
      - name: V1.5 draft typfall and structured legal requisites
        run: node scripts/rekvisit_typfall_15_test.mjs
      - name: V1.5 review of 2026 BrB 10:5 changes
        run: node scripts/brb10_15_test.mjs
      - name: Three-year source verification UI safeguards
        run: node scripts/quality_11_test.mjs
      - name: Full catalog integration and statutes test
        run: node scripts/integration_09.mjs
      - name: Catalog-wide quality audit
        run: node scripts/audit_catalog.mjs
      - name: Archive full quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brottskatalog-quality-audit
          path: audit/quality-report.json
          if-no-files-found: warn
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve test app
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Test iPhone viewport and interactions
        run: node scripts/ui_smoke.mjs
