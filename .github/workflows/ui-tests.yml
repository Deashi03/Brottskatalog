permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sixteen BrB penalty ranges and conflict protection
        run: node scripts/core_penalties_13_test.mjs
      - name: Verify offence stages
        run: node scripts/stage_rules_test.mjs
      - name: V1.5 BrB 14:13 title alias, specific money attempt scope and ringa exception
        run: node scripts/brb14_stage_scope_15_test.mjs
      - name: V1.5 age-14 statute exception, dates, minimum and stage limitations
        run: node scripts/age14_offence_scope_15_test.mjs
      - name: Verify new 2026 public-office offences
        run: node scripts/brb20_13_test.mjs
      - name: Verify core BrB chapter 4 penalty source checks
        run: node scripts/brb4_14_test.mjs
      - name: Verify BrB 17 police-related penalty scales
        run: node scripts/brb17_14_test.mjs
      - name: Verify specialty criminal penalty scales
        run: node scripts/special_penalties_14_test.mjs
      - name: V1.5 draft source-scoped BrB14 expansions
        run: node scripts/brb14_15_test.mjs
      - name: V1.5 draft typfall and structured legal requisites
        run: node scripts/rekvisit_typfall_15_test.mjs
      - name: V1.5 source-linked common offence requisite expansion
        run: node scripts/rekvisit_core_15_test.mjs
      - name: V1.5 source-linked minor and aggravated offence grades
        run: node scripts/rekvisit_grader_15_test.mjs
      - name: V1.5 statutory documents, public order and source-specific typecase
        run: node scripts/rekvisit_special_15_test.mjs
      - name: V1.5 police-oriented BrB objective and subjective requisites
        run: node scripts/rekvisit_polisiara_15_test.mjs
      - name: V1.5 complex statutory offence variants and gross levels
        run: node scripts/rekvisit_alternativ_15_test.mjs
      - name: V1.5 full BrB 4:4a/4:4e text and compound fridsbrott requirements
        run: node scripts/brb4_fridtext_15_test.mjs
      - name: V1.5 corrected child peace and sex offences statutory text
        run: node scripts/brb_source_repairs_15_test.mjs
      - name: V1.5 BrB 9/19 current pretrial stage statutes and conditional wartime penalty
        run: node scripts/brb_stage_source_repairs_15_test.mjs
      - name: V1.5 complete BrB chapter 4 offence requisite pathways
        run: node scripts/rekvisit_frid_luckor_15_test.mjs
      - name: V1.5 full BrB chapter 17 public-official and voting offence pathways
        run: node scripts/rekvisit_tjanst_15_test.mjs
      - name: V1.5 complete BrB 8–9 payment, market and economic crime requisites
        run: node scripts/rekvisit_ekonomi_15_test.mjs
      - name: V1.5 BrB 5, 10, 11, 14 and 15 source-scoped requisite coverage
        run: node scripts/rekvisit_fortsattning_15_test.mjs
      - name: V1.5 all BrB chapter 13 statutory offence structures
        run: node scripts/rekvisit_allmanfara_15_test.mjs
      - name: V1.5 complete BrB 16 offence routes, exceptions, and gradings
        run: node scripts/rekvisit_ordning_15_test.mjs
      - name: V1.5 four BrB 18 high-offence requisites
        run: node scripts/rekvisit_hogmal_15_test.mjs
      - name: V1.5 BrB 19 national security and foreign intelligence distinctions
        run: node scripts/rekvisit_riket_15_test.mjs
      - name: V1.5 wartime BrB 21–22 applicability and convention exemptions
        run: node scripts/rekvisit_krig_15_test.mjs
      - name: V1.5 all 319 BrB offences structurally covered, without false legal approval
        run: node scripts/rekvisit_sista_15_test.mjs
      - name: V1.5 statutory parser regression against false SFS paragraph references
        run: |
          python3 -m pip install --user beautifulsoup4
          python3 scripts/test_brb_parser_15.py
      - name: V1.5 validate 23 BidrBrL PTBL SkBrL LBE statutory grade scales
        run: node scripts/special_other_penalty_grades_15_test.mjs
      - name: V1.5 verify twenty-three SmuglL individual completed grade penalty scales
        run: node scripts/smuggling_penalty_grades_15_test.mjs
      - name: V1.5 nine simple police typfall retained without misleading legal signoff
        run: node scripts/rekvisit_simple_typecases_15_test.mjs
      - name: V1.5 hide premature coercion green lights and correct RB 24:2 custody exception
        run: node scripts/coercive_safety_15_test.mjs
      - name: V1.5 all fourteen conditional penalty pathways visible with no automatic choice
        run: node scripts/brb_conditional_penalty_options_15_test.mjs
      - name: V1.5 derivative penalty reference safety for BrB 3:10 and 14:10
        run: node scripts/brb_derivative_penalties_15_test.mjs
      - name: V1.5 special-law grade-only crosschecks against four current SFS texts
        run: node scripts/special_penalty_grade_audit_15_test.mjs
      - name: V1.5 154 individually compared current BrB statutory paragraphs
        run: node scripts/brb_curated_lawtext_15_test.mjs
      - name: V1.5 chapter-16 fulltext extension with official source crosschecks
        run: node scripts/brb16_fulltext_15_test.mjs
      - name: V1.5 BrB 17 and 18 additional current statutory paragraphs
        run: node scripts/brb17_18_fulltext_15_test.mjs
      - name: V1.5 restore four complete SFS paragraphs truncated by the importer
        run: node scripts/brb_truncated_source_repairs_15_test.mjs
      - name: V1.5 13 further current sex-offence provisions, fulltext only
        run: node scripts/brb6_further_fulltext_15_test.mjs
      - name: V1.5 chapter 19 full-source comparison and restored stage/prosecution sections
        run: node scripts/brb19_fulltext_15_test.mjs
      - name: V1.5 full-current BrB 20-22 provisions and future effect exceptions
        run: node scripts/brb20_22_fulltext_15_test.mjs
      - name: V1.5 BrB 13 current complete source text and special stage preservation
        run: node scripts/brb13_fulltext_15_test.mjs
      - name: V1.5 all 319 BrB cards fully dated and source-text-complete
        run: node scripts/brb15_complete_fulltext_15_test.mjs
      - name: V1.5 source-check full fridskränkning and hedersförtryck text, every BrB card
        run: node scripts/brb4_frid_current_provenance_15_test.mjs
      - name: V1.5 source-checked current child-witness and stalking requisite alternatives
        run: node scripts/brb4_child_stalking_requisites_15_test.mjs
      - name: V1.5 falsk angivelse, falsk beskyllning and correction-of-error safeguards
        run: node scripts/brb15_false_report_requisites_15_test.mjs
      - name: V1.5 Chapter 5 private prosecution and underage/public-interest exceptions
        run: node scripts/brb5_prosecution_15_test.mjs
      - name: V1.5 bribery prosecutorial rules and BrB 20:5 public-service exceptions
        run: node scripts/brb10_prosecution_15_test.mjs
      - name: V1.5 BrB 8:13 close-relative prosecution exceptions and stages safeguard
        run: node scripts/brb8_near_relative_prosecution_15_test.mjs
      - name: V1.5 BrB 12:6 special prosecution when only private rights are infringed
        run: node scripts/brb12_prosecution_15_test.mjs
      - name: V1.5 chapter four special prosecution restrictions and place qualifiers
        run: node scripts/brb4_prosecution_15_test.mjs
      - name: V1.5 BrB 11:8 creditor negligence and ringa bookkeeping prosecution exceptions
        run: node scripts/brb11_prosecution_15_test.mjs
      - name: V1.5 25 individual current-grade penalty range comparisons
        run: node scripts/brb_penalty_grade_audit_15_test.mjs
      - name: V1.5 documented HD Vapenbilden example and police-statutory correction
        run: node scripts/praxis_vapenbilden_15_test.mjs
      - name: V1.5 HD Freja electronic-urkund acquittal, source check and offline regression
        run: node scripts/praxis_freja_electronic_urkund_15_test.mjs
      - name: V1.5 documentary forgery versus false statement and document misuse
        run: node scripts/urkund_gransdragning_15_test.mjs
      - name: V1.5 intricate offence alternatives, minority and public-order requisites
        run: node scripts/rekvisit_fordjupning_15_test.mjs
      - name: V1.5 child/adult sex-offence distinctions and limited statutory exemptions
        run: node scripts/rekvisit_sexualbrott_15_test.mjs
