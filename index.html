  <script>(function(){
/* 1.7 snabbstart: temat sätts direkt, den förrenderade sökvyn är sökbar via ett litet index,
   och appens moduler (i <template id="bk17-modules">) körs i oförändrad ordning efter första målningen. */
var B=window.BK_BOOT17={ready:false,query:'',category:'Alla'};
try{var t=JSON.parse(localStorage.getItem('brottskatalog.steg1.theme')||'"auto"');var h=new Date().getHours();document.documentElement.dataset.theme=t==='auto'?(h>=22||h<6?'dark':'light'):t;}catch(e){document.documentElement.dataset.theme='light';}
if(typeof document==='undefined'||!document.addEventListener)return;
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 §:.]+/g,' ').trim();};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var rows=function(){var I=window.BK_SEARCH_INDEX17;return I?I.rows:null;};
// Samma rangordning som sortedCrimes() i appen; index: [id,title,ref,shortRef,aliases,category,stageType,stageStatus,penaltyShort]
function search(){
 var all=rows();if(!all)return null;var q=norm(B.query);
 var stageQuery=/^(forsok|forberedelse|stampling)\b/.test(q);
 var list=all.filter(function(c){return (B.category==='Alla'||c[5]===B.category)&&(!c[6]||stageQuery);});
 if(!B.query.trim())return list;
 var tokens=q.split(' ').filter(Boolean);
 var scored=list.map(function(c){
  var title=norm(c[1]),ref=norm(c[2]+' '+c[3]),aliases=(c[4]||[]).map(norm);
  var hay=[title,ref].concat(aliases,[String(c[5]).toLowerCase()]).join(' ');
  if(!tokens.every(function(t){return hay.indexOf(t)>=0;}))return {c:c,s:-1};
  // 2.0: exakt lagrum först, ordbörjan före träff inuti ord.
  var isRef=/\d/.test(q),esc2=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var refExact=isRef&&new RegExp('(^|[^0-9])'+esc2+'($|[^0-9a-z])').test(ref),wordStart=new RegExp('(^| )'+esc2);
  var s=title===q?200:title.indexOf(q)===0?160:refExact?150:aliases.some(function(a){return a===q;})?140:wordStart.test(title)?120:aliases.some(function(a){return a.indexOf(q)===0;})?105:aliases.some(function(a){return wordStart.test(a);})?95:!isRef&&ref.indexOf(q)>=0?80:title.indexOf(q)>=0?60:ref.indexOf(q)>=0?40:30;
  return {c:c,s:s};
 }).filter(function(o){return o.s>=0;});
 scored.sort(function(a,b){return b.s-a.s;});
 return scored.map(function(o){return o.c;});
}
function render(){
 var area=document.getElementById('results-area');if(!area)return;
 var list=search();if(!list){area.setAttribute('aria-busy','true');return;}
 var chev=(document.querySelector('#results-area .crime-side svg')||{}).outerHTML||'';
 var card=function(c){var badge=c[7]==='not-criminalized'?'<span class="stage-badge no">Ej straffbart</span>':c[7]==='unverified'?'<span class="stage-badge pending">Ej verifierat</span>':'';
  return '<button type="button" class="crime-card" data-open="'+esc(c[0])+'" aria-label="Öppna '+esc(c[1])+'"><span class="crime-text"><span class="crime-title">'+esc(c[1])+'</span><span class="crime-ref">'+esc(c[3])+'</span></span><span class="crime-side">'+(badge||'<span class="crime-penalty">'+esc(c[8])+'</span>')+chev+'</span></button>';};
 B.chev=B.chev||chev;chev=B.chev;
 area.innerHTML='<div class="section-heading"><h2>'+(B.query?'Sökresultat':'Brottskatalog')+'</h2><span>'+list.length+' '+(list.length===1?'träff':'träffar')+'</span></div>'+
  (list.length?'<div class="crime-list">'+list.map(card).join('')+'</div>':'<div class="empty"><h3>Inga träffar</h3><p>Prova ett annat begrepp eller lagrum.</p></div>');
 area.removeAttribute('aria-busy');
 var quick=document.getElementById('quick-area');if(quick)quick.hidden=!!B.query;
 var clear=document.querySelector('.search-clear');if(clear)clear.style.display=B.query?'':'none';
}
document.addEventListener('input',function(e){if(B.ready||!e.target||e.target.id!=='crime-search')return;B.query=e.target.value;render();});
document.addEventListener('click',function(e){
 if(B.ready)return;var el=e.target.closest&&e.target.closest('[data-open],[data-category],[data-tab],[data-action="clear-search"]');if(!el)return;
 e.preventDefault();
 if(el.dataset.open){location.hash='#brott/'+el.dataset.open;el.classList.add('bk-boot-pending');el.setAttribute('aria-busy','true');document.documentElement.classList.add('bk-booting');return;}
 if(el.dataset.tab){location.hash='#'+el.dataset.tab;document.documentElement.classList.add('bk-booting');return;}
 if(el.dataset.category){B.category=el.dataset.category;document.querySelectorAll('[data-category]').forEach(function(b){var on=b===el;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});render();return;}
 var i=document.getElementById('crime-search');if(i){i.value='';B.query='';render();i.focus();}
});
function addScript(src,ordered){var s=document.createElement('script');s.src=src;s.async=!ordered;document.body.appendChild(s);return s;}
var started=false;
function start(){
 if(started)return;started=true;
 var tpl=document.getElementById('bk17-modules'),nodes=tpl?tpl.content.querySelectorAll('script'):[];
 for(var k=0;k<nodes.length;k++){var n=nodes[k],src=n.getAttribute('src');
  addScript(src||URL.createObjectURL(new Blob([n.textContent],{type:'text/javascript'})),true);}
}
document.addEventListener('DOMContentLoaded',function(){
 var s=addScript('./search-index-17.js',false);s.onload=function(){if(!B.ready&&B.query)render();};
 if(window.requestAnimationFrame)requestAnimationFrame(function(){setTimeout(start,0);});
 setTimeout(start,120);
});
})();</script>

<script>
/* Offline-lagrum för steg 2. Avgränsat urval; ingenting hämtas vid användning. */
(() => {
const BRB='https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/brottsbalk-1962700_sfs-1962-700-s/';
const RB='https://data.riksdagen.se/dokument/sfs-1942-740.html';
const NARK='https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/narkotikastrafflag-196864_sfs-1968-64/';
const VAPEN='https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/vapenlag-2026408_sfs-2026-408/';
const TBL='https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1951649-om-straff-for-vissa-trafikbrott_sfs-1951-649/';
const KNIV='https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1988254-om-forbud-betraffande-knivar-och_sfs-1988-254/';
const out={};
function add(id,ref,text,url,complete=true){out[id]={id,ref,text,url,complete,checked:'2026-10-12'};}
add('BrB:8:1','BrB 8 kap. 1 §',`Den som olovligen tager vad annan tillhör med uppsåt att tillägna sig det, dömes, om tillgreppet innebär skada, för stöld till fängelse i högst två år.`,BRB);
add('BrB:8:2','BrB 8 kap. 2 §',`Är brott som avses i 1 § med hänsyn till det tillgripnas värde och övriga omständigheter vid brottet att anse som ringa, döms för ringa stöld till böter eller fängelse i högst sex månader.`,BRB);
add('BrB:8:4','BrB 8 kap. 4 §',`Är brott som avses i 1 § att anse som grovt, döms för grov stöld till fängelse i lägst ett och högst sex år.

Vid bedömningen av om brottet är grovt ska det särskilt beaktas om det avsett sak som någon bar på sig eller hade i sin omedelbara närhet, om gärningsmannen varit försedd med vapen, sprängämne eller annat dylikt hjälpmedel, om gärningen ingått som ett led i en brottslighet som utövats systematiskt eller om gärningen annars varit av särskilt farlig eller hänsynslös art, avsett betydande värde eller inneburit synnerligen kännbar skada.`,BRB);
add('BrB:8:4a','BrB 8 kap. 4 a §',`Om brott som avses i 1 § har skett efter intrång i bostad eller annat liknande boende, döms för inbrottsstöld till fängelse i lägst ett och högst sex år.

Är en gärning som avses i första stycket med hänsyn till integritetskränkningen eller omständigheterna i övrigt av mindre allvarlig art, döms dock inte för inbrottsstöld utan för annat brott som gärningen innefattar.`,BRB);
add('BrB:8:5','BrB 8 kap. 5 §',`Den som med våld på person eller med hot som innebär eller för den hotade framstår som trängande fara,
1. begår stöld,
2. tvingar någon till handling eller underlåtenhet som innebär vinning för gärningsmannen och skada för den tvingade eller någon i vars ställe denne är, eller
3. olovligen tar eller tvingar till sig ett betalningsverktyg med avsikt att använda det för att bereda sig själv eller någon annan vinning,

döms för rån till fängelse i lägst ett år och sex månader och högst sex år.

För rån döms också den som, sedan han eller hon begått stöld eller olovligen tagit ett betalningsverktyg och anträffats på bar gärning, sätter sig till motvärn med sådant våld eller hot som avses i första stycket mot den som vill återta det tillgripna.

Lika med våld anses att försätta någon i vanmakt eller annat sådant tillstånd.

Om en gärning som avses i första-tredje styckena med hänsyn till våldet, hotet eller omständigheterna i övrigt är av mindre allvarlig art, döms dock inte för rån utan för annat brott som gärningen innefattar.`,BRB);
add('BrB:8:6','BrB 8 kap. 6 §',`Om brott som avses i 5 § är grovt, döms för grovt rån till fängelse i lägst fem och högst tio år.

Vid bedömningen av om brottet är grovt ska det särskilt beaktas
1. om våldet har varit livsfarligt,
2. om gärningsmannen har tillfogat svår kroppsskada eller allvarlig sjukdom eller annars har visat synnerlig råhet eller på ett hänsynslöst sätt har utnyttjat den rånades skyddslösa eller utsatta ställning, eller
3. om gärningen har varit av särskilt farlig art.`,BRB);
add('BrB:8:13','BrB 8 kap. 13 §',`Har annat i detta kapitel angivet brott än grov stöld, inbrottsstöld, rån eller grovt rån förövats mot
1. någon som inte endast tillfälligt sammanbodde med gärningsmannen,
2. make, den som är i rätt upp- eller nedstigande släktskap eller svågerlag, syskon, svåger eller svägerska, eller
3. någon annan som på liknande sätt är närstående till gärningsmannen,
får åklagaren väcka åtal endast om målsäganden har angett brottet till åtal eller åtal är påkallat ur allmän synpunkt.

Vid tillämpning av vad nu sagts ska med gärningsman likställas någon annan som medverkat vid brottet och den som gjort sig skyldig till häleri eller häleriförseelse.`,BRB);
add('BrB:3:5','BrB 3 kap. 5 §',`Den som tillfogar en annan person kroppsskada, sjukdom eller smärta eller försätter honom eller henne i vanmakt eller något annat sådant tillstånd, döms för misshandel till fängelse i högst två år eller, om brottet är ringa, till böter eller fängelse i högst sex månader.`,BRB);
add('BrB:3:6','BrB 3 kap. 6 §',`Är brott som avses i 5 § att anse som grovt, döms för grov misshandel till fängelse i lägst ett år och sex månader och högst sju år. Vid bedömningen av om brottet är grovt ska det särskilt beaktas om gärningen var livsfarlig eller om gärningsmannen har tillfogat en svår kroppsskada eller allvarlig sjukdom eller annars visat särskild hänsynslöshet eller råhet.

Är brottet att anse som synnerligen grovt, döms för synnerligen grov misshandel till fängelse i lägst sex och högst tolv år. Vid bedömningen av om brottet är synnerligen grovt ska det särskilt beaktas om kroppsskadan är bestående eller om gärningen har orsakat synnerligt lidande eller om gärningsmannen har visat synnerlig hänsynslöshet.`,BRB);
add('BrB:4:6','BrB 4 kap. 6 §',`Den som olovligen tränger in eller stannar kvar i någon annans bostad eller annat liknande boende döms för hemfridsbrott till böter eller fängelse i högst ett år. För hemfridsbrott döms också den som olovligen tränger in eller stannar kvar i en trädgård, på en gårdsplan eller på en annan liknande plats som tillhör bostaden eller boendet.

Den som i annat fall än som avses i första stycket obehörigen tränger in eller stannar kvar i en byggnad eller ett fartyg, på en gårdsplan eller på en annan liknande plats döms för olaga intrång till böter eller fängelse i högst ett år.

Om ett brott som avses i första eller andra stycket är grovt, döms för grovt hemfridsbrott eller grovt olaga intrång till fängelse i lägst sex månader och högst tre år. Vid bedömningen av om brottet är grovt ska det särskilt beaktas om gärningen
1. har skett genom inbrott,
2. har innefattat våld, hot om brottslig gärning, ofredande eller skada på egendom, eller
3. annars har varit av särskilt hänsynslös eller farlig art.`,BRB);
add('BrB:4:7','BrB 4 kap. 7 §',`Den som fysiskt antastar någon annan eller utsätter någon annan för störande kontakter eller annat hänsynslöst agerande döms, om gärningen är ägnad att kränka den utsattes frid på ett kännbart sätt, för ofredande till böter eller fängelse i högst ett år.`,BRB);
add('BrB:4:7b','BrB 4 kap. 7 b §',`Den som upprepat utsätter en annan person för kränkningar i form av beskyllning, nedsättande uttalande, förödmjukande beteende, otillbörligt hot, otillbörligt tvång eller otillbörlig övervakning, döms, om kränkningarna sammantagna varit ägnade att allvarligt skada personens självkänsla, för psykiskt våld till fängelse i högst fyra år.

För psykiskt våld döms också den som utsätter en annan person för otillbörlig övervakning som är varaktig, om gärningen varit ägnad att allvarligt skada personens självkänsla.`,BRB);
add('BrB:4:11','BrB 4 kap. 11 §',`Hemfridsbrott, olaga intrång, kränkande fotografering eller förberedelse till sådant brott, olovlig identitetsanvändning, olaga integritetsintrång, ofredande som inte förövats på allmän plats, intrång i förvar, olovlig avlyssning som inte förövats på allmän plats eller förberedelse till sådant brott får åtalas av åklagare endast om målsäganden anger brottet till åtal eller om åtal är påkallat från allmän synpunkt. Detsamma gäller olaga tvång genom hot att åtala eller ange annan för brott eller att om annan lämna menligt meddelande samt försök eller förberedelse till sådant brott.`,BRB);
add('BrB:9:1','BrB 9 kap. 1 §',`Den som medelst vilseledande förmår någon till handling eller underlåtenhet, som innebär vinning för gärningsmannen och skada för den vilseledde eller någon i vars ställe denne är, dömes för bedrägeri till fängelse i högst två år.

För bedrägeri döms också den som genom att lämna oriktig eller ofullständig uppgift, genom att ändra i program eller upptagning eller på annat sätt olovligen påverkar resultatet av en automatisk informationsbehandling eller någon annan liknande automatisk process, så att det innebär vinning för gärningsmannen och skada för någon annan.`,BRB);
add('BrB:9:2','BrB 9 kap. 2 §',`Är brott som avses i 1 § med hänsyn till skadans omfattning och övriga omständigheter vid brottet att anse som ringa, döms för ringa bedrägeri till böter eller fängelse i högst sex månader.

För ringa bedrägeri döms också den som utan att göra rätt för sig tillgodogör sig husrum, förtäring, transport, tillträde till föreställning eller annat sådant som tillhandahålls under förutsättning av kontant betalning, oavsett om han eller hon vilseleder någon eller inte. Det gäller dock inte om gärningen avser värde som inte är ringa och om den i övrigt är sådan som avses i 1 §.`,BRB);
add('BrB:9:3','BrB 9 kap. 3 §',`Är brott som avses i 1 § att anse som grovt, döms för grovt bedrägeri till fängelse i lägst ett och högst sex år.

Vid bedömningen av om brottet är grovt ska det särskilt beaktas om
1. gärningsmannen har missbrukat allmänt förtroende eller använt urkund eller annat vars brukande är straffbart enligt 14 eller 15 kap. eller vilseledande bokföring,
2. gärningsmannen på ett hänsynslöst sätt har utnyttjat offrets skyddslösa eller utsatta ställning,
3. gärningen har avsett betydande värde eller inneburit synnerligen kännbar skada,
4. gärningen har ingått i en brottslighet som utövats i organiserad form eller systematiskt, eller
5. gärningen annars har varit av särskilt farlig art.`,BRB);
add('BrB:12:1','BrB 12 kap. 1 §',`Den som förstör eller skadar egendom till men för någon annans rätt till den döms för skadegörelse till fängelse i högst två år.`,BRB);
add('BrB:12:2','BrB 12 kap. 2 §',`Är brott som avses i 1 § med hänsyn till skadans obetydlighet och övriga omständigheter vid brottet att anse som ringa, döms för ringa skadegörelse till böter eller fängelse i högst sex månader.`,BRB);
add('BrB:12:3','BrB 12 kap. 3 §',`Om brott som avses i 1 § är att anse som grovt, döms för grov skadegörelse till fängelse i lägst ett och högst sex år.

Vid bedömningen av om brottet är grovt ska det särskilt beaktas om gärningen har medfört betydande fara för någons liv eller hälsa, om skadan drabbat sak av stor kulturell eller ekonomisk betydelse eller annars är synnerligen kännbar eller om gärningen varit av särskilt hänsynslös art.`,BRB);
add('BrB:12:6','BrB 12 kap. 6 §',`Ringa skadegörelse, åverkan eller tagande av olovlig väg får, om brottet endast kränker enskilds rätt, åtalas av åklagare bara om åtal av särskilda skäl är motiverat från allmän synpunkt.`,BRB);
add('BrB:17:1','BrB 17 kap. 1 §',`Den som med våld eller hot om brottslig gärning angriper en tjänsteman vid hans eller hennes myndighetsutövning eller för att tvinga fram, hindra eller hämnas för en åtgärd vid myndighetsutövningen döms för våld eller hot mot tjänsteman till böter eller fängelse i högst tre år. Detsamma gäller om någon på detta sätt angriper en tjänsteman som tidigare har utövat myndighet för vad han eller hon har gjort eller inte gjort vid myndighetsutövningen.

Om brottet är grovt döms för grovt våld eller hot mot tjänsteman till fängelse i lägst ett år och sex månader och högst åtta år. Vid bedömningen av om brottet är grovt ska det särskilt beaktas om gärningen
1. har innefattat våld av allvarligt slag,
2. har innefattat hot som påtagligt har förstärkts med hjälp av vapen, sprängämne eller vapenattrapp eller genom anspelning på ett våldskapital eller som annars har varit av allvarligt slag, eller
3. annars har varit av särskilt hänsynslös eller farlig art.`,BRB);
add('BrB:17:3','BrB 17 kap. 3 §',`Den som angriper en tjänsteman vid hans eller hennes myndighetsutövning eller för att tvinga fram, hindra eller hämnas för en åtgärd vid myndighetsutövningen, genom att rikta beskyllning, nedsättande uttalande eller förödmjukande beteende mot tjänstemannen döms, om gärningen är ägnad att kränka tjänstemannens självkänsla eller värdighet, för förolämpning mot tjänsteman till böter eller fängelse i högst sex månader.`,BRB);
add('BrB:17:4','BrB 17 kap. 4 §',`Den som, i annat fall än som avses i 1 och 2 §§, genom att sätta sig till motvärn eller annars med våld försöker hindra en tjänsteman vid hans eller hennes myndighetsutövning, döms för våldsamt motstånd till böter eller fängelse i högst sex månader.`,BRB);
add('Nark:1','Narkotikastrafflagen 1 §',`Den som olovligen
1. överlåter narkotika,
2. framställer narkotika som är avsedd för missbruk,
3. förvärvar narkotika i överlåtelsesyfte,
4. anskaffar, bearbetar, förpackar, transporterar, förvarar eller tar annan sådan befattning med narkotika som inte är avsedd för eget bruk, eller
5. innehar, brukar eller tar annan befattning med narkotika

döms för narkotikabrott till fängelse i högst tre år.

Om en gärning som avses i första stycket innebär att gärningsmannen säljer narkotika eller annars befattar sig med narkotika som är avsedd att säljas, döms i stället till fängelse i lägst sex månader och högst tre år.

För narkotikabrott döms även den som olovligen bjuder ut narkotika till försäljning, förvarar eller befordrar vederlag för narkotika, förmedlar kontakter mellan säljare och köpare eller företar någon annan sådan åtgärd, om förfarandet är ägnat att främja narkotikahandel. Straffet är i ett sådant fall fängelse i lägst sex månader och högst tre år.

Bestämmelser om straff för olovlig införsel och utförsel av narkotika och olovlig befattning i vissa fall med narkotika finns i lagen (2000:1225) om straff för smuggling.`,NARK);
add('Nark:2','Narkotikastrafflagen 2 §',`Är brott som avses i 1 § första stycket med hänsyn till arten och mängden narkotika samt övriga omständigheter att anse som ringa, döms för ringa narkotikabrott till böter eller fängelse i högst sex månader.`,NARK);
add('Nark:3','Narkotikastrafflagen 3 §',`Är brott som avses i 1 § att anse som grovt, döms för grovt narkotikabrott till fängelse i lägst två och högst sju år. Vid bedömningen av om brottet är grovt ska det särskilt beaktas om brottet har utgjort ett led i en verksamhet som bedrivits i större omfattning eller yrkesmässigt, avsett en särskilt stor mängd narkotika eller annars varit av särskilt farlig eller hänsynslös art.

Är brottet att anse som synnerligen grovt, döms för synnerligen grovt narkotikabrott till fängelse i lägst sex och högst tio år. Vid bedömningen av om brottet är synnerligen grovt ska det särskilt beaktas om brottet har utgjort ett led i en verksamhet som utövats i organiserad form i syfte att i stor omfattning bedriva handel med narkotika, avsett en synnerligen stor mängd narkotika eller annars varit av synnerligen farlig eller hänsynslös art.`,NARK);
add('Nark:4','Narkotikastrafflagen 4 §',`För försök eller förberedelse till narkotikabrott, ringa narkotikabrott, grovt narkotikabrott eller synnerligen grovt narkotikabrott liksom för stämpling till narkotikabrott, grovt narkotikabrott eller synnerligen grovt narkotikabrott döms det, om gärningen avser annat än bruk av narkotika, till ansvar enligt 23 kap. brottsbalken.

För försök till olovlig befattning med narkotikaprekursorer döms det, om gärningen avser annan befattning än som avses i 3 b § första stycket 2, till ansvar enligt 23 kap. brottsbalken.`,NARK);
add('Vapen:18:1','Vapenlagen (2026:408) 18 kap. 1 §',`Den som uppsåtligen innehar eller tillverkar ett skjutvapen utan att ha rätt till det eller överlåter, yrkesmässigt förmedlar eller lånar ut ett skjutvapen till någon som inte har rätt att inneha vapnet döms för vapenbrott till fängelse i högst fem år.

Om brottet med hänsyn till risken för att vapnet skulle komma till brottslig eller annan skadlig användning och övriga omständigheter är att anse som mindre allvarligt, döms till böter eller fängelse i högst sex månader.

Till böter eller fängelse i högst sex månader döms också den som har begått gärningen av oaktsamhet.`,VAPEN);
add('Vapen:18:2','Vapenlagen (2026:408) 18 kap. 2 §',`Om ett brott som avses i 1 § första stycket är grovt, döms för grovt vapenbrott till fängelse i lägst fyra och högst sju år. Vid bedömningen av om brottet är grovt ska det särskilt beaktas om
1. vapnet har innehafts på allmän plats eller på en annan plats där människor brukar samlas eller har samlats eller i ett fordon på en sådan plats,
2. vapnet har varit av särskilt farlig beskaffenhet,
3. innehavet, tillverkningen, överlåtelsen, förmedlingen eller utlåningen har avsett flera vapen,
4. vapnet har innehafts eller tillverkats i en sådan miljö att det typiskt sett kan befaras komma till brottslig användning, eller
5. gärningen annars har varit av särskilt farlig art.

Om ett brott som avses i 1 § första stycket är synnerligen grovt, döms för synnerligen grovt vapenbrott till fängelse i lägst sex och högst tio år. Vid bedömningen av om brottet är synnerligen grovt ska det särskilt beaktas om innehavet, tillverkningen, överlåtelsen, förmedlingen eller utlåningen har avsett ett stort antal vapen eller flera vapen av särskilt farlig beskaffenhet.

Vid bedömningen enligt första och andra styckena ska ett enhandsvapen anses vara av särskilt farlig beskaffenhet, om det är kraftfullt eller har en särskilt farlig konstruktion eller utformning.`,VAPEN);
add('TBL:3','Trafikbrottslagen 3 §',`För någon uppsåtligen körkortspliktigt fordon utan att vara berättigad att föra sådant fordon, dömes för olovlig körning till böter. Har han tidigare innehaft körkort som blivit återkallat eller har brottet skett vanemässigt eller är det eljest att anse som grovt, må dömas till fängelse i högst sex månader.

För någon körkortspliktigt fordon med uppsåtligt eller oaktsamt åsidosättande av föreskrift, som meddelats i fråga om rätten att föra sådant fordon, dömes till böter.

Om någon uppsåtligen eller av oaktsamhet såsom förare av körkortspliktigt fordon anställer och brukar den som inte äger rätt att föra fordonet, eller i annat fall tillåter någon annan att föra sådant fordon utan att denne är berättigad därtill, dömes likaledes till böter.

Första-tredje styckena äger motsvarande tillämpning på förare av traktor, moped klass II, snöskoter, terränghjuling, motorredskap eller spårvagn och på den som anställer eller brukar sådan förare eller eljest tillåter någon att föra sådant fordon.`,TBL);
add('TBL:4','Trafikbrottslagen 4 §',`Den som för ett motordrivet fordon eller en spårvagn efter att ha intagit alkohol i så stor mängd att alkoholkoncentrationen under eller efter färden uppgår till minst 0,2 promille i blodet eller 0,10 milligram per liter i utandningsluften döms för rattfylleri till böter eller fängelse i högst sex månader.

För rattfylleri enligt första stycket döms också den som för ett motordrivet fordon eller en spårvagn efter att ha intagit narkotika som avses i 8 § narkotikastrafflagen (1968:64) i så stor mängd att det under eller efter färden finns något narkotiskt ämne kvar i blodet. Detta gäller dock inte om narkotikan intagits i enlighet med läkares eller annan behörig receptutfärdares ordination.

För rattfylleri enligt första stycket döms också den som för ett motordrivet fordon eller en spårvagn och då är så påverkad av alkohol att det kan antas att han eller hon inte kan framföra fordonet på ett betryggande sätt. Detsamma gäller om föraren är lika påverkad av något annat medel.

Första och andra styckena gäller inte förare av ett motordrivet fordon, som är avsett att föras av gående.

Första, andra och tredje styckena gäller inte om förandet av fordonet ingår som ett led i en vetenskaplig eller därmed jämförlig undersökning till vilken tillstånd har lämnats av regeringen eller den myndighet som regeringen bestämmer.`,TBL);
add('TBL:4a','Trafikbrottslagen 4 a §',`Är ett brott som avses i 4 § första, andra eller tredje stycket att anse som grovt, skall föraren dömas för grovt rattfylleri till fängelse i högst två år. Vid bedömande av om brottet är grovt skall särskilt beaktas om
1. föraren har haft en alkoholkoncentration som uppgått till minst 1,0 promille i blodet eller 0,50 milligram per liter i utandningsluften,
2. föraren annars har varit avsevärt påverkad av alkohol eller något annat medel, eller
3. framförandet av fordonet har inneburit en påtaglig fara för trafiksäkerheten.`,TBL);
add('Kniv:1','Knivlagen 1 §',`Knivar, andra stick- och skärvapen och andra föremål som är ägnade att användas som vapen vid brott mot liv eller hälsa får inte innehas på allmän plats, inom skolområde där grundskole- eller gymnasieundervisning bedrivs, eller i fordon på allmän plats.

Förbudet i första stycket gäller inte, om föremålet enligt särskilda föreskrifter ingår i utrustning för viss tjänst eller visst uppdrag eller om innehavet annars med hänsyn till föremålets art, innehavarens behov och övriga omständigheter är att anse som befogat.

Stickvapen eller knivar som är konstruerade så att klingan eller bladet snabbt kan fällas eller skjutas ut ur sitt skaft (springstiletter eller springknivar) får inte innehas av personer under 21 år.`,KNIV);
add('Kniv:4','Knivlagen 4 §',`Den som uppsåtligen bryter mot 1 eller 2 § döms till böter eller fängelse i högst ett år.

Om gärningen har begåtts av oaktsamhet, döms till böter eller fängelse i högst sex månader.

Om ett brott som avses i första stycket är grovt, döms till fängelse i lägst sex månader och högst två år. Vid bedömningen av om brottet är grovt ska det särskilt beaktas om
1. föremålet har innehafts i ett sammanhang där det kan befaras komma till användning vid brottsligt angrepp på någons liv, hälsa eller trygghet till person,
2. föremålet har varit av särskilt farlig beskaffenhet,
3. innehavet, överlåtelsen eller saluhållandet har avsett flera föremål, eller
4. gärningen på annat sätt har varit av särskilt farlig art.

Om det rör sig om ringa fall utgör gärningen dock inte brott.`,KNIV);
add('RB:24:1','RB 24 kap. 1 §',`Den som på sannolika skäl är misstänkt för ett brott för vilket det är föreskrivet fängelse i ett år eller mer får häktas, om det med hänsyn till brottets beskaffenhet, den misstänktes förhållanden eller någon annan omständighet finns risk för att han eller hon
1. avviker eller på något annat sätt undandrar sig lagföring eller straff,
2. genom att undanröja bevis eller på något annat sätt försvårar sakens utredning, eller
3. fortsätter sin brottsliga verksamhet.

Häktning ska ske om det inte är uppenbart att skäl till häktning saknas och misstanken avser
1. ett brott för vilket det inte är föreskrivet lindrigare straff än fängelse i ett år och sex månader,
2. försök, förberedelse eller stämpling till ett brott för vilket det inte är föreskrivet lindrigare straff än fängelse i fyra år, eller
3. grov fridskränkning, grov kvinnofridskränkning eller hedersförtryck enligt 4 kap. 4 a eller 4 e § brottsbalken.

Häktning får ske endast om skälen för åtgärden uppväger det intrång eller men i övrigt som åtgärden innebär för den misstänkte eller för något annat motstående intresse.

Kan det antas att den misstänkte kommer att dömas endast till böter, får häktning inte ske.`,RB);
add('RB:24:2','RB 24 kap. 2 §',`Den som på sannolika skäl är misstänkt för brott får häktas oberoende av brottets beskaffenhet,
1. om han är okänd och vägrar att uppge namn och hemvist eller om hans uppgift om detta kan antas vara osann, eller
2. om han saknar hemvist inom riket och det finns risk för att han genom att bege sig från riket undandrar sig lagföring eller straff.`,RB);

// Brott där samma lagrum har flera rubriceringar behåller olika sökingångar men visar gemensam fullständig paragraf.
const existing = new Set(D.crimes.map(x=>x.id));
D.crimes.push(...C.filter(x=>!existing.has(x.id)));
// Urvalsregel: ALLA brott enligt Brottsbalken behålls. I specialstraffrätten
// utesluts ENDAST straffbestämmelser vars hela straffskala är penningböter.
// Det generella ordet "böter" betyder inte att straffet enbart är penningböter.
// Vid import bör penaltyKind sättas explicit till 'penningboter-only',
// 'dagsboter', 'fines-or-imprisonment' eller 'imprisonment' efter lagkontroll.
// Påverkar katalogens sökträffar, inte källtexten i lagbiblioteket.
function isCatalogCrime(c) {
  if (/^BrB(?::|\b)/i.test(String(c.statute || c.shortRef || ''))) return true;
  if (c.penaltyKind === 'penningboter-only') return false;
  if (c.penaltyKind === 'penningboter-or-more') return true;
  const scale = String(c.penalty || '').trim().toLowerCase();
  return !/^(?:endast\s+)?penningböter\.?$/.test(scale);
}
D.crimes = D.crimes.filter(isCatalogCrime);
D.selectionRule = 'Brottsbalken: alla brott. Specialstraffrätt: endast brott med strängare straff i skalan än enbart penningböter. Dagsböter omfattas.';
// Synonymer och förbättrad uppdelning av originalens datagränser.
D.crimes.forEach(c=>{
  if(!c.statute){
    const m=c.shortRef.match(/^BrB (\d+):(\d+)\s*(a|b)?/);
    if(m)c.statute=`BrB:${m[1]}:${m[2]}${m[3]||''}`;
    if(c.id.startsWith('narkotikabrott')||c.id.startsWith('ringa-narkotikabrott'))c.statute=c.id.includes('ringa')?'Nark:2':'Nark:1';
  }
  const sec=window.BK_STATUTES[c.statute];
  if(sec){c.law=sec.text;c.lawMode='full';c.lawSource=sec.ref;c.statuteSource=sec.url;}
  if(c.id==='ran'){c.penalty='Fängelse 1 år 6 mån–6 år';c.penaltyShort='F 1,5–6 år';c.custody='presumption';}
  if(c.id==='ofredande'){
    c.prosecution='conditional';c.prosecutionLabel='Villkor beroende på plats';c.prosecutionRule='BrB 4:11';
    c.prosecutionDetails=['På allmän plats: allmänt åtal utan den särskilda begränsningen i BrB 4:11.','Inte på allmän plats: angivelse av målsäganden eller att åtal är påkallat från allmän synpunkt.','Det är inte bara bostäder som omfattas av undantaget; avgörande är om det är allmän plats.'];
  }
  if(c.id==='hemfridsbrott'){Object.assign(c,pre4)}
});
D.date='2026-10-12';
})();

 }
 const p=String(c.penalty||'Kontroll krävs').trim();

let fu18State=null;
function fu18Draw(){

function showFu18(c){

document.addEventListener('click',e=>{

 const q=b.closest('[data-fu18-q]')?.dataset.fu18Q,act=b.dataset.fu18,S=fu18State;
 const set=v=>{S.hist.push(q);S.ans={...S.ans,[q]:v};};
 if(act==='yes')set(true);else if(act==='no')set(false);
 else if(act==='none')set([]);
 else if(act==='multi')set([...b.closest('.fu18').querySelectorAll('input:checked')].map(i=>i.value));
 else if(act==='back'){const last=S.hist.pop();if(last){const a={...S.ans};delete a[last];S.ans=a;}}
 else if(act==='restart'){S.ans={};S.hist=[];}
 fu18Draw();
});
function showProsecution(c){

function showTerm(term,ref=''){

function toast(msg){
  document.querySelector('.toast')?.remove();
  const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=msg;document.body.append(el);
  setTimeout(()=>el.remove(),2200);

function rememberRecent(id){state.recents=[id,...state.recents.filter(x=>x!==id)].slice(0,10);writeSetting('recents',state.recents);}
function goRoute(route){ if(window.location.hash===route){renderRoute();return;}window.location.hash=route; }
function resetCrimeMenus161(){
 // Reset the entire open-state tree before leaving the current crime card.
 // This includes top-level accordions, RB chapters and coercive-measure details.
 for(const details of app.querySelectorAll('.detail-body details[open]'))details.open=false;
 for(const input of app.querySelectorAll('.detail-body .coercive-filter'))input.checked=false;

function renderRoute(){
  resetCrimeMenus161();
  closeSheet();
  const raw=decodeURIComponent(location.hash||'#sok');
  const id=raw.startsWith('#brott/')?raw.slice(7):null;
  if(id&&byId[id]){
    rememberRecent(id);renderDetail(byId[id]);state.tab='detail';window.scrollTo({top:0,behavior:'instant'});return;
  }
  if(raw==='#sparat'){state.tab='sparat';renderSaved();}
  else if(raw==='#mer'){state.tab='mer';renderMore();}
  else {state.tab='sok';renderSearch();}
  window.scrollTo({top:0,behavior:'instant'});
}
function refreshConnection(){
  const el=document.getElementById('connection-state');

}
document.addEventListener('click', async e=>{
  const lt=e.target.closest('[data-coercive-lt]');
  if(lt){e.preventDefault();e.stopPropagation();showCoerciveLaw16(lt.dataset.coerciveLt);return;}
  const info=e.target.closest('[data-decision-info]');

   e.preventDefault();e.stopPropagation();
   const measure=window.BK_COERCIVE?.entries?.find(x=>x.id===info.dataset.decisionInfo);
   const guide=measure&&window.BK_COERCIVE?.decisionGuide?.(measure);
   if(guide){
     showSheet({kicker:'RB · BESLUTSBEHÖRIGHET',title:measure.title,body:guide.lines,ref:guide.ref});
   }
   return;
  }
  const move=e.target.closest('[data-move]');if(move){const n=state.favorites.indexOf(move.dataset.id),d=move.dataset.move==='up'?-1:1,j=n+d;if(n>=0&&j>=0&&j<state.favorites.length){[state.favorites[n],state.favorites[j]]=[state.favorites[j],state.favorites[n]];writeSetting('favorites',state.favorites);renderSaved();}return;}
  const opener=e.target.closest('[data-open]');if(opener){const id=opener.dataset.open;if(byId[id]){state.navStack.push(location.hash||'#sok');goRoute('#brott/'+id);}return;}
  const provision=e.target.closest('[data-provision]');if(provision){showProvision(provision.dataset.provision);return;}
  const rqdef=e.target.closest('[data-rq-def]');if(rqdef){const d=(window.BK_DEF19||{})[rqdef.dataset.rqDef];if(d)showSheet({kicker:'DEFINITION · '+d.ref.toUpperCase(),title:d.term,body:'<div class="law-paper">'+escapeHtml(d.text)+'</div>'+(d.note?'<p>'+escapeHtml(d.note)+'</p>':''),ref:d.ref,actionHtml:d.url?'<a class="source-link" href="'+escapeHtml(d.url)+'" target="_blank" rel="noopener noreferrer">Lagtext hos Sveriges riksdag '+ic('external-link','sm')+'</a>':''});return;}
  const term=e.target.closest('[data-term]');if(term){showTerm(term.dataset.term,term.dataset.termContext);return;}
  const tab=e.target.closest('[data-tab]');if(tab){state.navStack=[];goRoute('#'+tab.dataset.tab);return;}
  const category=e.target.closest('[data-category]');if(category){state.category=category.dataset.category;renderSearch();return;}
  const density=e.target.closest('[data-density]');if(density){state.density=density.dataset.density;writeSetting('density',state.density);renderMore();return;}
  const theme=e.target.closest('[data-theme-choice]');if(theme){state.theme=theme.dataset.themeChoice;writeSetting('theme',state.theme);applyTheme();renderMore();return;}
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const action=btn.dataset.action,id=btn.dataset.id;
  if(action==='report' && byId[id]){
    const c=byId[id];
    const report='Brottskatalog '+(window.BK_RELEASE||window.BK_DATA.release)+'\nBrott: '+c.title+'\nLagrum: '+c.ref+'\nTyp av fel (lagtext/straffskala/åtal/begrepp/annat):\nVad bör rättas?\nKälla eller förslag:\n(Inga person- eller ärendeuppgifter.)';
    try{await navigator.clipboard.writeText(report);toast('Mall för felrapport kopierad');}
    catch{
      showSheet({kicker:'FELRAPPORT · INGEN DATA SKICKAS',title:'Kopiera denna mall',body:[report],ref:'Undvik uppgifter om verkliga ärenden. Skriv in rapporten i projektets GitHub Issues eller denna chatt.'});
    }
    return;
  }
  if(action==='close-sheet'){closeSheet();return;}
  if(action==='back-sheet'){const old=sheetHistory.pop();if(old){sheetRoot.innerHTML=old;}else{closeSheet();}return;}
  if(action==='clear-search'){state.query='';const inp=document.getElementById('crime-search');if(inp){inp.value='';inp.focus();}document.querySelector('.search-clear').style.display='none';document.getElementById('quick-area').hidden=false;updateResults();return;}
  if(action==='back'){goRoute(state.navStack.pop()||'#sok');return;}
  if(action==='custody'){showCustody(byId[id]);return;}
  if(action==='prosecution'){showProsecution(byId[id]);return;}
  if(action==='fu18'){showFu18(byId[id]);return;}
  if(action==='favorite'){
    if(state.favorites.includes(id)){state.favorites=state.favorites.filter(x=>x!==id);toast('Borttagen från sparade');}
    else{state.favorites.push(id);toast('Sparad i favoriter');}
    writeSetting('favorites',state.favorites);
    const saved=state.favorites.includes(id);
    btn.innerHTML=ic(saved?'bookmark-fill':'bookmark','lg');btn.classList.toggle('active',saved);
    btn.setAttribute('aria-pressed',String(saved));btn.setAttribute('aria-label',saved?'Ta bort från favoriter':'Spara i favoriter');return;

    try{await navigator.clipboard.writeText(byId[id].shortRef);toast('Lagrum kopierat');}catch{toast('Kunde inte kopiera på denna sida');}return;
  }
});
